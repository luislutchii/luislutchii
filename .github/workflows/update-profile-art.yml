name: Update profile art
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install workflow dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Fetch public contribution calendar
        env:
          GITHUB_USERNAME: luislutchii
        run: python scripts/fetch_contributions.py
      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py
      - name: Commit changed files only
        run: |
          if [[ -n "$(git status --porcelain data/contributions.json contrib-heatmap.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/contributions.json contrib-heatmap.svg
            git commit -m "chore: refresh contribution heatmap [skip ci]"
            git push
          else
            echo "No generated changes."
          fi
